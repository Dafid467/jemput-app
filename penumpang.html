<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jemput Penumpang - Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  #peta-lokasi { height: 220px; width: 100%; border-radius: 1rem; }
</style>
</head>
<body class="bg-[#F3F6F4]">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const firebaseConfig = {
  apiKey: "AIzaSyCSn_E5myNF4uo0O1LJDKj5FHRJiDt0fAc",
  authDomain: "jemput-93fd0.firebaseapp.com",
  projectId: "jemput-93fd0",
  storageBucket: "jemput-93fd0.appspot.com",
  messagingSenderId: "229069926763",
  appId: "1:229069926763:web:36ed7a66c6a3e8d561dc2e",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const rupiah = (n) => "Rp" + Number(n).toLocaleString("id-ID");

function hitungJarakKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function hitungHarga(jarakKm) {
  const tarifDasar = 5000;
  const tarifPerKm = 2500;
  const faktorKoreksi = 1.3;
  const harga = tarifDasar + tarifPerKm * jarakKm * faktorKoreksi;
  return Math.round(harga / 500) * 500;
}

function LocationPicker({ pickupCoord, destCoord, onPickupSet, onDestSet }) {
  const mapDivRef = useRef(null);
  const mapObjRef = useRef(null);
  const pickupMarkerRef = useRef(null);
  const destMarkerRef = useRef(null);
  const [mode, setMode] = useState("pickup");
  const modeRef = useRef(mode);
  modeRef.current = mode;

  useEffect(() => {
    const map = L.map(mapDivRef.current).setView([-8.1844, 113.6681], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    map.on('click', (e) => {
      const { lat, lng } = e.latlng;
      if (modeRef.current === "pickup") {
        if (pickupMarkerRef.current) {
          pickupMarkerRef.current.setLatLng([lat, lng]);
        } else {
          pickupMarkerRef.current = L.circleMarker([lat, lng], {
            radius: 9, color: "#0FA968", fillColor: "#0FA968", fillOpacity: 1, weight: 2,
          }).addTo(map);
        }
        onPickupSet({ lat, lng });
      } else {
        if (destMarkerRef.current) {
          destMarkerRef.current.setLatLng([lat, lng]);
        } else {
          destMarkerRef.current = L.circleMarker([lat, lng], {
            radius: 9, color: "#FF7A1A", fillColor: "#FF7A1A", fillOpacity: 1, weight: 2,
          }).addTo(map);
        }
        onDestSet({ lat, lng });
      }
    });

    mapObjRef.current = map;
    return () => map.remove();
  }, []);

  return (
    <div>
      <div className="flex gap-2 mb-2">
        <button
          onClick={() => setMode("pickup")}
          className={"flex-1 py-2 rounded-lg text-xs font-bold " + (mode === "pickup" ? "bg-[#0FA968] text-white" : "bg-[#E4EAE6] text-[#6B7280]")}
        >
          🟢 Tandai Jemput
        </button>
        <button
          onClick={() => setMode("dest")}
          className={"flex-1 py-2 rounded-lg text-xs font-bold " + (mode === "dest" ? "bg-[#FF7A1A] text-white" : "bg-[#E4EAE6] text-[#6B7280]")}
        >
          🟠 Tandai Tujuan
        </button>
      </div>
      <div id="peta-lokasi" ref={mapDivRef}></div>
      <p className="text-[11px] text-[#6B7280] mt-2">
        Tap peta untuk menandai titik {mode === "pickup" ? "jemput (hijau)" : "tujuan (oranye)"}.
      </p>
    </div>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const submit = async () => {
    setError("");
    try {
      if (mode === "login") {
        await auth.signInWithEmailAndPassword(email, password);
      } else {
        await auth.createUserWithEmailAndPassword(email, password);
      }
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl border border-[#E4EAE6] p-5">
        <p className="text-lg font-black text-[#0E2A1E] mb-1">
          {mode === "login" ? "Login Penumpang" : "Daftar Akun Baru"}
        </p>
        <p className="text-xs text-[#6B7280] mb-4">Jemput Penumpang</p>

        <p className="text-xs font-bold text-[#6B7280] mb-1">EMAIL</p>
        <input
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          className="w-full text-sm border-b border-[#E4EAE6] pb-2 mb-3 outline-none"
        />
        <p className="text-xs font-bold text-[#6B7280] mb-1">PASSWORD</p>
        <input
          type="password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          className="w-full text-sm border-b border-[#E4EAE6] pb-2 mb-3 outline-none"
        />
        {error && <p className="text-xs text-[#FF7A1A] mb-3">{error}</p>}

        <button onClick={submit} className="w-full py-3 rounded-xl bg-[#0FA968] text-white font-bold text-sm">
          {mode === "login" ? "Login" : "Daftar"}
        </button>

        <button
          onClick={() => setMode(mode === "login" ? "daftar" : "login")}
          className="w-full mt-3 text-xs text-[#6B7280] font-semibold"
        >
          {mode === "login" ? "Belum punya akun? Daftar di sini" : "Sudah punya akun? Login di sini"}
        </button>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined);
  const [pickup, setPickup] = useState("Kos Griya Mangli, Jl. Mangli Indah No. 8");
  const [dest, setDest] = useState("");
  const [pickupCoord, setPickupCoord] = useState(null);
  const [destCoord, setDestCoord] = useState(null);
  const [orderId, setOrderId] = useState(null);
  const [order, setOrder] = useState(null);
  const [driverName, setDriverName] = useState("");

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!orderId) return;
    const unsub = db.collection("orders").doc(orderId).onSnapshot(async (docSnap) => {
      const data = docSnap.data();
      setOrder(data);
      if (data && data.driverId) {
        const driverDoc = await db.collection("drivers").doc(data.driverId).get();
        if (driverDoc.exists) setDriverName(driverDoc.data().name);
      }
    });
    return () => unsub();
  }, [orderId]);

  const jarakKm = useMemo(() => {
    if (!pickupCoord || !destCoord) return null;
    return hitungJarakKm(pickupCoord.lat, pickupCoord.lng, destCoord.lat, destCoord.lng);
  }, [pickupCoord, destCoord]);

  const estimasiHarga = useMemo(() => {
    if (jarakKm === null) return null;
    return hitungHarga(jarakKm);
  }, [jarakKm]);

  const siapPesan = dest.trim() && pickupCoord && destCoord;

  const pesanRide = async () => {
    const fare = estimasiHarga;
    const docRef = await db.collection("orders").add({
      type: "ride",
      pickup,
      destination: dest,
      pickupLat: pickupCoord.lat,
      pickupLng: pickupCoord.lng,
      destLat: destCoord.lat,
      destLng: destCoord.lng,
      jarakKm: Number(jarakKm.toFixed(2)),
      fare,
      status: "searching",
      driverId: null,
      passengerId: user.uid,
      passengerEmail: user.email,
    });
    setOrderId(docRef.id);
  };

  const pesanLagi = () => {
    setOrderId(null);
    setOrder(null);
    setDriverName("");
    setDest("");
    setPickupCoord(null);
    setDestCoord(null);
  };

  const logout = () => auth.signOut();

  if (user === undefined) {
    return <p className="text-center py-20 text-[#6B7280]">Memuat...</p>;
  }
  if (!user) {
    return <AuthScreen />;
  }

  return (
    <div className="min-h-screen flex items-start justify-center py-6 px-3">
      <div className="w-full max-w-sm bg-[#F3F6F4] rounded-[2rem] shadow-xl overflow-hidden border border-[#E4EAE6]">
        <div className="bg-[#0E2A1E] text-white px-5 pt-5 pb-4 flex items-center justify-between">
          <div>
            <p className="text-lg font-black">Jemput Penumpang</p>
            <p className="text-[11px] text-white/60">{user.email}</p>
          </div>
          <button onClick={logout} className="px-3 py-1.5 rounded-full text-xs font-bold bg-white/10">
            Keluar
          </button>
        </div>

        <div className="px-4 py-4 min-h-[380px]">
          {!orderId ? (
            <div className="bg-white rounded-2xl border border-[#E4EAE6] p-4">
              <p className="text-xs font-bold text-[#6B7280] mb-1">JEMPUT DARI</p>
              <input
                value={pickup}
                onChange={(e) => setPickup(e.target.value)}
                className="w-full text-sm text-[#0E2A1E] outline-none border-b border-[#E4EAE6] pb-2 mb-3"
              />
              <p className="text-xs font-bold text-[#6B7280] mb-1">MAU KE MANA?</p>
              <input
                value={dest}
                onChange={(e) => setDest(e.target.value)}
                placeholder="Tulis alamat tujuan"
                className="w-full text-sm text-[#0E2A1E] outline-none border-b border-[#E4EAE6] pb-2 mb-3"
              />

              <p className="text-xs font-bold text-[#6B7280] mb-2">TANDAI DI PETA</p>
              <LocationPicker
                pickupCoord={pickupCoord}
                destCoord={destCoord}
                onPickupSet={setPickupCoord}
                onDestSet={setDestCoord}
              />

              {jarakKm !== null && (
                <div className="mt-3 bg-[#F3F6F4] rounded-xl p-3">
                  <p className="text-xs text-[#6B7280]">Estimasi jarak: <span className="font-bold text-[#0E2A1E]">{jarakKm.toFixed(1)} km</span></p>
                  <p className="text-xs text-[#6B7280]">Estimasi harga: <span className="font-bold text-[#0FA968]">{rupiah(estimasiHarga)}</span></p>
                </div>
              )}

              <button
                onClick={pesanRide}
                disabled={!siapPesan}
                className="w-full mt-4 py-3 rounded-xl bg-[#0FA968] text-white font-bold text-sm disabled:bg-[#E4EAE6] disabled:text-[#9AA5A0]"
              >
                {siapPesan ? `Pesan Jemput (${rupiah(estimasiHarga)})` : "Tandai titik jemput & tujuan dulu"}
              </button>
            </div>
          ) : (
            <div className="bg-white rounded-2xl border border-[#E4EAE6] p-4">
              {order && order.status === "searching" && (
                <p className="text-sm font-bold text-[#0E2A1E]">Mencari driver terdekat...</p>
              )}
              {order && order.status === "matched" && (
                <div>
                  <p className="text-xs font-bold text-[#0FA968] mb-2">DRIVER DITEMUKAN</p>
                  <p className="text-sm text-[#0E2A1E]">{driverName || "Memuat nama driver..."}</p>
                  <p className="text-sm text-[#6B7280] mt-1">Menuju lokasi jemputmu</p>
                </div>
              )}
              {order && order.status === "onTrip" && (
                <p className="text-sm font-bold text-[#0E2A1E]">Sedang mengantarmu ke tujuan...</p>
              )}
              {order && order.status === "completed" && (
                <div>
                  <p className="text-sm font-bold text-[#0FA968]">Perjalanan selesai!</p>
                  <button
                    onClick={pesanLagi}
                    className="w-full mt-4 py-3 rounded-xl bg-[#0FA968] text-white font-bold text-sm"
                  >
                    Pesan Lagi
                  </button>
                </div>
              )}
              <p className="text-xs text-[#6B7280] mt-2">Tujuan: {dest}</p>
              {order && order.jarakKm && (
                <p className="text-xs text-[#6B7280]">Jarak: {order.jarakKm} km &middot; Tarif: {rupiah(order.fare)}</p>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
