name: Cocokkan Order Otomatis

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  cocokkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase
      - run: node cocokkan-order.js
