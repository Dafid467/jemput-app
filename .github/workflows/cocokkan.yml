name: Cocokkan Order Otomatis

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  cocokkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase firebase-admin
      - run: node cocokkan-order.js
        env:
          SYSTEM_EMAIL: ${{ secrets.SYSTEM_EMAIL }}
          SYSTEM_PASSWORD: ${{ secrets.SYSTEM_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
